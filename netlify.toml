[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-audit --no-fund"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "out"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200